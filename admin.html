<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foresstree Admin Panel</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="toast-container" id="toasts"></div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>
<div class="admin-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><span>🌳</span> Foresstree <small style="font-size:.55rem;background:rgba(255,255,255,.2);padding:2px 6px;border-radius:4px;margin-left:4px">ADMIN</small></div>
    </div>
    <nav class="sidebar-menu">
      <div class="menu-item active" id="menu-dashboard" onclick="showPage('dashboard')">📊 Dashboard</div>
      <div class="menu-item" id="menu-products" onclick="showPage('products')">📦 Products</div>
      <div class="menu-item" id="menu-orders" onclick="showPage('orders')">🛍️ Orders</div>
      <div class="menu-item" id="menu-customers" onclick="showPage('customers')">👥 Customers</div>
      <div class="menu-item" id="menu-coupons" onclick="showPage('coupons')">🎟️ Coupons</div>
      <div class="menu-divider"></div>
      <div class="menu-item" onclick="window.location.href='index.html'">🏪 View Store</div>
    </nav>
  </aside>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <h1 id="pageTitle">📊 Dashboard</h1>
      </div>
      <div class="topbar-actions">
        <div id="topbarStatus" style="font-size:.8rem;font-weight:600;color:#5a6a5a"></div>
        <button class="btn btn-primary" id="topbarBtn" onclick="showPage('products')" style="padding:8px 16px;font-size:.85rem">+ Add Product</button>
      </div>
    </div>
    <div class="page-content" id="pageContent">
      <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
    </div>
  </div>
</div>

<!-- Login Screen -->
<div id="loginScreen" style="position:fixed;inset:0;background:#0f2818;display:flex;align-items:center;justify-content:center;z-index:9999">
  <div style="background:#fff;border-radius:16px;padding:40px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="font-size:3rem;margin-bottom:12px">🌳</div>
    <h2 style="font-size:1.4rem;font-weight:800;margin-bottom:6px;color:#0f2818">Foresstree Admin</h2>
    <p style="color:#5a6a5a;font-size:.9rem;margin-bottom:24px">Enter your password to continue</p>
    <input type="password" id="adminPassword" placeholder="Password"
      style="width:100%;padding:12px 16px;border:2px solid #dce8dc;border-radius:10px;font-size:1rem;margin-bottom:12px;outline:none;font-family:inherit"
      onkeydown="if(event.key==='Enter')checkLogin()">
    <button onclick="checkLogin()"
      style="width:100%;padding:13px;background:#1a6b2f;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer">
      Login →
    </button>
    <div id="loginError" style="color:#e74c3c;font-size:.85rem;margin-top:10px;display:none">❌ Wrong password!</div>
  </div>
</div>

<script src="js/admin.js?v=2"></script>
</body>
</html>
