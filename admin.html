<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foresstree Admin Panel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f4f0; color: #1a1a1a; }

/* ===== LAYOUT ===== */
.admin-wrapper { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar { background: #0f2818; color: #fff; padding: 0; overflow-y: auto; position: sticky; top: 0; height: 100vh; }
.sidebar-header { padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
.sidebar-logo { font-size: 1.2rem; font-weight: 800; color: #6fcf7f; display: flex; align-items: center; gap: 8px; }
.sidebar-logo span { font-size: 1.4rem; }
.sidebar-menu { padding: 12px 0; }
.menu-item { display: flex; align-items: center; gap: 10px; padding: 12px 20px; font-size: .88rem; cursor: pointer; transition: .2s; color: rgba(255,255,255,.7); font-weight: 600; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,.08); color: #fff; }
.menu-item.active { background: rgba(255,255,255,.12); color: #fff; border-left-color: #6fcf7f; }
.menu-divider { height: 1px; background: rgba(255,255,255,.1); margin: 12px 16px; }
.main-content { overflow-y: auto; }

/* ===== TOPBAR ===== */
.topbar { background: #fff; border-bottom: 1px solid #e0e8e0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar h1 { font-size: 1.2rem; font-weight: 800; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.page-content { padding: 24px; }

/* ===== CARDS ===== */
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 1px solid #e0e8e0; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.card-title { font-size: 1rem; font-weight: 800; color: #1a6b2f; display: flex; align-items: center; gap: 8px; }

/* ===== STATS ===== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #e0e8e0; display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.05); transition: .2s; }
.stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.1); }
.stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
.stat-value { font-size: 1.6rem; font-weight: 800; line-height: 1; }
.stat-label { font-size: .78rem; color: #5a6a5a; margin-top: 3px; }
.stat-change { font-size: .74rem; margin-top: 4px; font-weight: 600; }
.positive { color: #27ae60; }
.negative { color: #e74c3c; }

/* ===== FORM ===== */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: .8rem; font-weight: 700; color: #5a6a5a; }
.form-group input, .form-group select, .form-group textarea { padding: 10px 13px; border: 1.5px solid #dce8dc; border-radius: 9px; font-size: .9rem; transition: .2s; background: #f8faf8; font-family: inherit; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #1a6b2f; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(26,107,47,.1); }

/* ===== UPLOAD ===== */
.upload-area { border: 2.5px dashed #b0d0b0; border-radius: 12px; padding: 28px; text-align: center; cursor: pointer; transition: .2s; background: #f8faf8; position: relative; }
.upload-area:hover { border-color: #1a6b2f; background: #f0f7f0; }
.upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
#imagePreview { margin-top: 12px; display: none; }
#imagePreview img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; border: 2px solid #dce8dc; }

/* ===== BUTTONS ===== */
.btn { padding: 10px 22px; border-radius: 9px; font-weight: 700; font-size: .88rem; cursor: pointer; transition: .2s; border: none; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
.btn-primary { background: #1a6b2f; color: #fff; }
.btn-primary:hover { background: #114a20; }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }
.btn-outline { background: none; border: 2px solid #1a6b2f; color: #1a6b2f; }
.btn-outline:hover { background: #1a6b2f; color: #fff; }
.btn-sm { padding: 6px 12px; font-size: .78rem; border-radius: 7px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; transition: .2s; }
.btn-danger-sm { background: #fde8e8; color: #e74c3c; }
.btn-danger-sm:hover { background: #e74c3c; color: #fff; }
.btn-success-sm { background: #e8f5e9; color: #27ae60; }
.btn-success-sm:hover { background: #27ae60; color: #fff; }
.btn-info-sm { background: #e3f2fd; color: #1976d2; }
.btn-info-sm:hover { background: #1976d2; color: #fff; }
.btn-warning-sm { background: #fff8e1; color: #f39c12; }
.btn-warning-sm:hover { background: #f39c12; color: #fff; }

/* ===== TABLE ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { background: #f0f7f0; padding: 11px 14px; text-align: left; font-size: .76rem; font-weight: 700; color: #5a6a5a; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
td { padding: 12px 14px; border-top: 1px solid #edf2ed; font-size: .87rem; vertical-align: middle; }
tr:hover td { background: #f8faf8; }
.product-img { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; border: 1px solid #dce8dc; }
.product-emoji { width: 46px; height: 46px; background: #f0f7f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; }

/* ===== BADGES ===== */
.badge { padding: 3px 10px; border-radius: 20px; font-size: .74rem; font-weight: 700; white-space: nowrap; }
.badge-green { background: #e8f5e9; color: #27ae60; }
.badge-red { background: #fde8e8; color: #e74c3c; }
.badge-yellow { background: #fff8e1; color: #f39c12; }
.badge-blue { background: #e3f2fd; color: #1976d2; }
.badge-purple { background: #f3e5f5; color: #9c27b0; }
.badge-gray { background: #f5f5f5; color: #666; }

/* ===== SEARCH ===== */
.search-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.search-row input { flex: 1; padding: 9px 14px; border: 1.5px solid #dce8dc; border-radius: 9px; font-size: .88rem; min-width: 180px; font-family: inherit; }
.search-row input:focus { border-color: #1a6b2f; outline: none; }
.search-row select { padding: 9px 14px; border: 1.5px solid #dce8dc; border-radius: 9px; font-size: .88rem; background: #fff; font-family: inherit; }

/* ===== STATUS ===== */
.server-status { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 9px; font-size: .84rem; font-weight: 600; margin-bottom: 20px; }
.server-online { background: #e8f5e9; color: #27ae60; border: 1px solid #c8e6c9; }
.server-offline { background: #fde8e8; color: #e74c3c; border: 1px solid #ffcdd2; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot-green { background: #27ae60; animation: pulse 2s infinite; }
.dot-red { background: #e74c3c; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(39,174,96,.4)} 50%{box-shadow:0 0 0 5px rgba(39,174,96,0)} }

/* ===== TOAST ===== */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 12px 20px; border-radius: 10px; color: #fff; font-weight: 600; font-size: .87rem; animation: slideIn .3s ease; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: flex; align-items: center; gap: 8px; min-width: 240px; }
.toast-success { background: #27ae60; }
.toast-error { background: #e74c3c; }
.toast-warning { background: #f39c12; }
@keyframes slideIn { from{transform:translateX(110%);opacity:0} to{transform:none;opacity:1} }

/* ===== MODAL ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
.modal-overlay.show { display: flex; animation: fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal { background: #fff; border-radius: 16px; padding: 28px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; animation: slideUp .3s ease; }
@keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:none;opacity:1} }
.modal-close { position: absolute; top: 14px; right: 14px; background: #f0f4f0; border: none; font-size: 1rem; color: #5a6a5a; padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: .2s; }
.modal-close:hover { background: #e74c3c; color: #fff; }

/* ===== LOADING ===== */
.loading { text-align: center; padding: 48px; color: #5a6a5a; }
.spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #dce8dc; border-top-color: #1a6b2f; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to{transform:rotate(360deg)} }
.empty { text-align: center; padding: 48px; color: #5a6a5a; }
.empty .icon { font-size: 3rem; margin-bottom: 12px; }

/* ===== ORDER DETAIL ===== */
.order-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
.order-detail-box { background: #f8faf8; border-radius: 10px; padding: 14px; border: 1px solid #e0e8e0; }
.order-detail-label { font-size: .75rem; font-weight: 700; color: #5a6a5a; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.order-item-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #edf2ed; }
.order-item-row:last-child { border-bottom: none; }
.order-summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: .9rem; }
.order-summary-row.total { font-size: 1rem; font-weight: 800; color: #1a6b2f; border-top: 2px solid #e0e8e0; padding-top: 10px; margin-top: 4px; }

/* ===== CHART ===== */
.chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 160px; padding-top: 20px; margin-top: 12px; }
.chart-bar { flex: 1; border-radius: 6px 6px 0 0; position: relative; transition: .4s; min-width: 18px; }
.chart-bar:hover { opacity: .8; }
.chart-bar-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: .6rem; color: #5a6a5a; white-space: nowrap; }
.chart-bar-value { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: .64rem; font-weight: 700; white-space: nowrap; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .admin-wrapper { grid-template-columns: 1fr; }
  .sidebar { display: none; position: fixed; z-index: 100; width: 240px; height: 100vh; }
  .sidebar.open { display: block; }
  .form-grid { grid-template-columns: 1fr; }
  .order-detail-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
}
.mobile-toggle { display: none; background: none; border: none; font-size: 1.4rem; cursor: pointer; padding: 4px 8px; }
@media (max-width: 768px) { .mobile-toggle { display: inline-flex; } }
</style>
</head>
<body>

<div class="toast-container" id="toasts"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div class="admin-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><span>🌳</span> Foresstree <small style="font-size:.55rem;background:rgba(255,255,255,.2);padding:2px 6px;border-radius:4px;margin-left:4px">ADMIN</small></div>
    </div>
    <nav class="sidebar-menu">
      <div class="menu-item active" id="menu-dashboard" onclick="showPage('dashboard')">📊 Dashboard</div>
      <div class="menu-item" id="menu-products" onclick="showPage('products')">📦 Products</div>
      <div class="menu-item" id="menu-orders" onclick="showPage('orders')">🛍️ Orders</div>
      <div class="menu-item" id="menu-customers" onclick="showPage('customers')">👥 Customers</div>
      <div class="menu-item" id="menu-coupons" onclick="showPage('coupons')">🎟️ Coupons</div>
      <div class="menu-divider"></div>
      <div class="menu-item" onclick="window.location.href='index.html'">🏪 View Store</div>
    </nav>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <!-- Topbar -->
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <h1 id="pageTitle">📊 Dashboard</h1>
      </div>
      <div class="topbar-actions">
        <div id="topbarStatus" style="font-size:.8rem;font-weight:600;color:#5a6a5a"></div>
        <button class="btn btn-primary" id="topbarBtn" onclick="showPage('products')" style="padding:8px 16px;font-size:.85rem">+ Add Product</button>
      </div>
    </div>

    <!-- Page Content -->
    <div class="page-content" id="pageContent">
      <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
    </div>
  </div>
</div>

<script>
const API = 'https://foresstree.onrender.com';
let allProducts = [], allOrders = [], currentPage = 'dashboard';
let serverOnline = false;

// ===== PAGE NAVIGATION =====
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
  const menuEl = document.getElementById('menu-' + page);
  if (menuEl) menuEl.classList.add('active');

  const titles = {
    dashboard: '📊 Dashboard',
    products: '📦 Products',
    orders: '🛍️ Orders',
    customers: '👥 Customers',
    coupons: '🎟️ Coupons',
  };
  document.getElementById('pageTitle').textContent = titles[page] || page;

  const topbarBtns = {
    products: { text: '➕ Add Product', action: 'showAddProductForm()' },
    orders: { text: '🔄 Refresh', action: 'loadOrders()' },
    dashboard: { text: '🔄 Refresh', action: 'loadDashboard()' },
    customers: { text: '🔄 Refresh', action: 'loadCustomers()' },
    coupons: { text: '➕ Add Coupon', action: 'showAddCouponModal()' },
  };
  const btn = topbarBtns[page] || {text:'', action:''};
  const topBtn = document.getElementById('topbarBtn');
  topBtn.textContent = btn.text;
  topBtn.onclick = new Function(btn.action);

  switch (page) {
    case 'dashboard': loadDashboard(); break;
    case 'products': loadProducts(); break;
    case 'orders': loadOrders(); break;
    case 'customers': loadCustomers(); break;
    case 'coupons': loadCoupons(); break;
  }

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
}

// ===== SERVER CHECK =====
async function checkServer() {
  try {
    const res = await fetch('https://foresstree.onrender.com/');
    if (res.ok) {
      serverOnline = true;
      document.getElementById('topbarStatus').innerHTML = '<span style="color:#27ae60">● Online</span>';
    }
  } catch {
    serverOnline = false;
    document.getElementById('topbarStatus').innerHTML = '<span style="color:#e74c3c">● Offline</span>';
  }
}

// ===== DASHBOARD =====
async function loadDashboard() {
  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading dashboard...</p></div>';

  let products = [], orders = [];
  try {
    const [pr, or] = await Promise.all([
      fetch(`${API}/products`).then(r => r.json()),
      fetch(`${API}/orders`).then(r => r.json()),
    ]);
    products = Array.isArray(pr) ? pr : [];
    orders = Array.isArray(or) ? or : [];
    allProducts = products;
    allOrders = orders;
  } catch(e) {
    products = allProducts;
    orders = allOrders;
  }

  const totalRevenue = orders.reduce((s, o) => s + (o.total || 0), 0);
  const todayOrders = orders.filter(o => {
    const d = new Date(o.createdAt);
    const today = new Date();
    return d.toDateString() === today.toDateString();
  }).length;

  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const chartValues = months.map((_, i) => {
    return orders.filter(o => new Date(o.createdAt).getMonth() === i).reduce((s,o) => s + (o.total||0), 0);
  });
  const maxVal = Math.max(...chartValues, 1000);

  const statusCounts = {Processing:0,Confirmed:0,Shipping:0,Delivered:0,Cancelled:0};
  orders.forEach(o => { if (statusCounts[o.status] !== undefined) statusCounts[o.status]++; });

  content.innerHTML = `
    <!-- Server Status -->
    <div class="server-status ${serverOnline ? 'server-online' : 'server-offline'}">
      <span class="dot ${serverOnline ? 'dot-green' : 'dot-red'}"></span>
      ${serverOnline ? '✅ Server online — সব data database এ save হচ্ছে' : '❌ Server offline — node server.js চালাও'}
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:#e8f5e9">💰</div>
        <div><div class="stat-value">৳${Math.round(totalRevenue * 110).toLocaleString()}</div><div class="stat-label">Total Revenue</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#e3f2fd">🛍️</div>
        <div><div class="stat-value">${orders.length}</div><div class="stat-label">Total Orders</div><div class="stat-change positive">Today: ${todayOrders}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fff3e0">📦</div>
        <div><div class="stat-value">${products.length}</div><div class="stat-label">Products</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fce4ec">⏳</div>
        <div><div class="stat-value">${statusCounts.Processing}</div><div class="stat-label">Pending Orders</div></div>
      </div>
    </div>

    <!-- Revenue Chart -->
    <div class="card">
      <div class="card-header"><div class="card-title">📈 Monthly Revenue (2026)</div></div>
      <div class="chart-bars">
        ${months.map((m, i) => `<div class="chart-bar" style="height:${Math.max((chartValues[i]/maxVal)*100, 4)}%;background:${chartValues[i] > 0 ? '#1a6b2f' : '#e0e8e0'}">
          <span class="chart-bar-value">৳${chartValues[i] > 0 ? Math.round(chartValues[i]*110/1000)+'k' : '0'}</span>
          <span class="chart-bar-label">${m}</span>
        </div>`).join('')}
      </div>
      <div style="margin-top:32px"></div>
    </div>

    <!-- Order Status + Recent Orders -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card">
        <div class="card-title" style="margin-bottom:14px">📊 Order Status</div>
        ${Object.entries(statusCounts).map(([status, count]) => {
          const colors = {Processing:'#f39c12',Confirmed:'#27ae60',Shipping:'#1976d2',Delivered:'#1a6b2f',Cancelled:'#e74c3c'};
          const pct = orders.length ? Math.round((count/orders.length)*100) : 0;
          return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <span style="width:80px;font-size:.82rem;font-weight:600">${status}</span>
            <div style="flex:1;height:20px;background:#f0f7f0;border-radius:10px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${colors[status]||'#999'};border-radius:10px;transition:.5s"></div>
            </div>
            <span style="font-weight:800;font-size:.85rem;min-width:28px">${count}</span>
          </div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">🕐 Recent Orders</div><button class="btn-sm btn-info-sm" onclick="showPage('orders')">View All</button></div>
        ${orders.slice(0,5).map(o => {
          const statusColor = {Processing:'#f39c12',Confirmed:'#27ae60',Shipping:'#1976d2',Delivered:'#1a6b2f',Cancelled:'#e74c3c'};
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #edf2ed;font-size:.85rem">
            <div>
              <div style="font-weight:700">${o.customer?.firstName} ${o.customer?.lastName||''}</div>
              <div style="font-size:.75rem;color:#5a6a5a">${o.customer?.phone||''} — ${new Date(o.createdAt).toLocaleDateString('en-BD')}</div>
            </div>
            <div style="text-align:right">
              <div style="font-weight:800;color:#1a6b2f">৳${Math.round((o.total||0)*110).toLocaleString()}</div>
              <span style="font-size:.72rem;font-weight:700;color:${statusColor[o.status]||'#666'}">${o.status}</span>
            </div>
          </div>`;
        }).join('') || '<div class="empty"><div class="icon" style="font-size:2rem">📋</div><p>No orders yet</p></div>'}
      </div>
    </div>
  `;
}

// ===== PRODUCTS =====
async function loadProducts() {
  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading products...</p></div>';
  try {
    const res = await fetch(`${API}/products`);
    allProducts = await res.json();
  } catch(e) {
    content.innerHTML = `<div class="card"><div class="empty"><div class="icon">❌</div><p>Server connect হচ্ছে না। <strong>node server.js</strong> চালাও।</p></div></div>`;
    return;
  }
  renderProductsPage();
}

function renderProductsPage() {
  const content = document.getElementById('pageContent');

function renderProductRows(products) {
  if (!products.length) return `<tr><td colspan="7"><div class="empty"><div class="icon">📦</div><p>No products found</p></div></td></tr>`;
  return products.map(p => `
    <tr>
      <td>${p.image ? `<img src="${p.image}" class="product-img" alt="${p.name}">` : `<div class="product-emoji">${p.icon||'📦'}</div>`}</td>
      <td>
        <div style="font-weight:700">${p.name}</div>
        <div style="font-size:.75rem;color:#5a6a5a">ID: ${p._id?.slice(-8)}</div>
        ${p.isFeatured==='true'||p.isFeatured===true ? '<span class="badge badge-green" style="margin-top:3px">⭐ Featured</span>' : ''}
        ${p.isNew==='true'||p.isNew===true ? '<span class="badge badge-yellow" style="margin-left:4px">🆕 New</span>' : ''}
      </td>
      <td><span class="badge badge-green" style="text-transform:capitalize">${p.category}</span></td>
      <td>
        <div style="font-weight:700;color:#1a6b2f">৳${Number(p.price).toLocaleString()}</div>
        ${p.originalPrice > p.price ? `<div style="font-size:.75rem;color:#999;text-decoration:line-through">৳${Number(p.originalPrice).toLocaleString()}</div>` : ''}
      </td>
      <td><span style="font-weight:700;color:${p.stock==0?'#e74c3c':p.stock<=5?'#f39c12':'#27ae60'}">${p.stock}</span></td>
      <td><span class="badge ${p.stock==0?'badge-red':p.stock<=5?'badge-yellow':'badge-green'}">${p.stock==0?'❌ Out':'p.stock<=5'?'⚠️ Low':'✅ In Stock'}</span></td>
      <td>
        <button class="btn-sm btn-info-sm" onclick="viewProduct(window._productMap['${p._id}'])" style="margin-right:4px">👁️ View</button>
        <button class="btn-sm btn-danger-sm" onclick="deleteProduct('${p._id}','${p.name.replace(/'/g,"\\'")}')">🗑️</button>
      </td>
    </tr>
  `).join('');
}

function filterProds() {
  const q = document.getElementById('prodSearch').value.toLowerCase();
  const cat = document.getElementById('prodCatFilter').value;
  const filtered = allProducts.filter(p => p.name.toLowerCase().includes(q) && (!cat || p.category === cat));
  document.getElementById('productsBody').innerHTML = renderProductRows(filtered);
}

function previewImg(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('imagePreview').style.display = 'block';
      document.getElementById('uploadArea').style.borderColor = '#1a6b2f';
    };
    reader.readAsDataURL(input.files[0]);
  }
}
function clearImg() {
  document.getElementById('p-image').value = '';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('uploadArea').style.borderColor = '#b0d0b0';
}

async function submitProduct(e) {
  e.preventDefault();
  const btn = document.getElementById('addProductBtn');
  btn.innerHTML = '⏳ Adding...'; btn.disabled = true;
  try {
    const formData = new FormData();
    formData.append('name', document.getElementById('p-name').value);
    formData.append('category', document.getElementById('p-category').value);
    formData.append('price', document.getElementById('p-price').value);
    formData.append('originalPrice', document.getElementById('p-original').value || document.getElementById('p-price').value);
    formData.append('stock', document.getElementById('p-stock').value);
    formData.append('icon', document.getElementById('p-icon').value || '📦');
    formData.append('description', document.getElementById('p-desc').value);
    formData.append('isFeatured', document.getElementById('p-featured').checked);
    formData.append('isNew', document.getElementById('p-new').checked);
    formData.append('freeShipping', document.getElementById('p-freeship').checked);
    const img = document.getElementById('p-image').files[0];
    if (img) formData.append('image', img);

    const res = await fetch(`${API}/products`, {method:'POST', body:formData});
    const data = await res.json();
    if (data.success) {
      showToast('Product added! ✅');
      resetProductForm();
      loadProducts();
    } else { showToast('Error: ' + data.error, 'error'); }
  } catch(err) { showToast('Server error!', 'error'); }
  finally { btn.innerHTML = '➕ Add Product'; btn.disabled = false; }
}

function resetProductForm() {
  document.getElementById('productForm').reset();
  clearImg();
}

async function deleteProduct(id, name) {
  if (!confirm(`"${name}" delete করবে?`)) return;
  try {
    const res = await fetch(`${API}/products/${id}`, {method:'DELETE'});
    const data = await res.json();
    if (data.success) { showToast(`"${name}" deleted!`, 'warning'); loadProducts(); }
    else { showToast('Delete failed', 'error'); }
  } catch { showToast('Server error!', 'error'); }
}

// ===== ORDERS =====
async function loadOrders() {
  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading orders...</p></div>';
  try {
    const res = await fetch(`${API}/orders`);
    allOrders = await res.json();
  } catch(e) {
    content.innerHTML = `<div class="card"><div class="empty"><div class="icon">❌</div><p>Server offline। <strong>node server.js</strong> চালাও।</p></div></div>`;
    return;
  }
  renderOrdersPage();
}

  content.innerHTML = `

    <div class="stats-grid" style="grid-template-columns:repeat(6,1fr)">
      ${['Processing','Confirmed','Shipping','Delivered','Cancelled','Returned'].map(s => {

        return `<div class="stat-card" style="padding:14px">

          <option value="Cash on Delivery">Cash on Delivery</option>

function renderOrderRows(orders) {
  if (!orders.length) return `<tr><td colspan="8"><div class="empty"><div class="icon">🛍️</div><p>No orders yet</p></div></td></tr>`;
  return orders.map(o => {
    const statusColors = {Processing:'badge-yellow',Confirmed:'badge-green',Shipping:'badge-blue',Delivered:'badge-green',Cancelled:'badge-red',Returned:'badge-purple'};
    const date = o.createdAt ? new Date(o.createdAt).toLocaleDateString('en-BD') : 'N/A';
    const itemCount = o.items?.length || 0;
    return `<tr>
      <td style="font-family:monospace;font-size:.8rem;color:#1a6b2f;font-weight:700">${o._id?.slice(-8)||'—'}</td>
      <td>
        <div style="font-weight:700">${o.customer?.firstName||'—'} ${o.customer?.lastName||''}</div>
        <div style="font-size:.78rem;color:#5a6a5a">${o.customer?.phone||''}</div>
        <div style="font-size:.76rem;color:#5a6a5a">${o.address?.district||''}, ${o.address?.division||''}</div>
      </td>
      <td>
        <div style="font-size:.82rem">${o.items?.slice(0,2).map(i=>`${i.icon||'📦'} ${i.name}`).join('<br>')||'—'}</div>
        ${itemCount > 2 ? `<div style="font-size:.75rem;color:#5a6a5a">+${itemCount-2} more</div>` : ''}
      </td>
      <td style="font-weight:800;color:#1a6b2f">৳${Math.round((o.total||0)*110).toLocaleString()}</td>
      <td><span style="font-size:.82rem">${o.paymentMethod||'—'}</span></td>
      <td style="font-size:.82rem;white-space:nowrap">${date}</td>
      <td>
        <select class="badge ${statusColors[o.status]||'badge-gray'}" style="border:none;font-weight:700;cursor:pointer;font-size:.74rem;padding:3px 8px;border-radius:20px"
          onchange="updateOrderStatus('${o._id}', this.value, this)">
          ${['Processing','Confirmed','Shipping','Delivered','Cancelled','Returned'].map(s => `<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td>
        <button class="btn-sm btn-info-sm" onclick="viewOrder(window._orderMap['${o._id}'])">👁️ View</button>
      </td>
    </tr>`;
  }).join('');
}

function filterOrders() {
  const q = document.getElementById('orderSearch').value.toLowerCase();
  const status = document.getElementById('orderStatusFilter').value;
  const payment = document.getElementById('orderPaymentFilter').value;
  const filtered = allOrders.filter(o => {
    const matchQ = !q || (o.customer?.firstName||'').toLowerCase().includes(q) ||
      (o.customer?.phone||'').includes(q) || (o._id||'').toLowerCase().includes(q);
    const matchStatus = !status || o.status === status;
    const matchPayment = !payment || (o.paymentMethod||'').includes(payment);
    return matchQ && matchStatus && matchPayment;
  });
  document.getElementById('ordersBody').innerHTML = renderOrderRows(filtered);
}

// ✅ Update order status
async function updateOrderStatus(id, status, selectEl) {
  try {
    const res = await fetch(`${API}/orders/${id}/status`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({status}),
    });
    const data = await res.json();
    if (data.success) {
      showToast(`Status → ${status} ✅`);
      // Update local data
      const order = allOrders.find(o => o._id === id);
      if (order) order.status = status;
      // Update select styling
      const statusColors = {Processing:'badge-yellow',Confirmed:'badge-green',Shipping:'badge-blue',Delivered:'badge-green',Cancelled:'badge-red',Returned:'badge-purple'};
      selectEl.className = `badge ${statusColors[status]||'badge-gray'}`;
      selectEl.style.cssText = 'border:none;font-weight:700;cursor:pointer;font-size:.74rem;padding:3px 8px;border-radius:20px';
    } else { showToast('Update failed', 'error'); }
  } catch { showToast('Server error!', 'error'); }
}

        <div class="order-detail-label">📅 Date & Status</div>
        <div style="font-size:.85rem">${date}</div>
        <div style="margin-top:6px">
          <select id="modalStatusSelect" style="border:1.5px solid #dce8dc;border-radius:8px;padding:5px 10px;font-size:.85rem;font-weight:700;background:#f8faf8">
            ${['Processing','Confirmed','Shipping','Delivered','Cancelled','Returned'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" style="flex:1" onclick="updateOrderStatus('${o._id}',document.getElementById('modalStatusSelect').value,{className:'',style:{cssText:''}});showToast('Status updated!');closeModal();loadOrders()">✅ Update Status</button>
      <button class="btn" style="background:#f0f4f0;color:#5a6a5a;font-weight:700" onclick="closeModal()">Close</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

// ===== CUSTOMERS =====
async function loadCustomers() {
  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';

  let orders = allOrders;
  try {
    if (!orders.length) {
      const res = await fetch(`${API}/orders`);
      orders = await res.json();
      allOrders = orders;
    }
  } catch {}

  // Group orders by phone
  const customerMap = {};
  orders.forEach(o => {
    const phone = o.customer?.phone || 'unknown';
    if (!customerMap[phone]) {
      customerMap[phone] = {
        name: `${o.customer?.firstName||''} ${o.customer?.lastName||''}`.trim(),
        phone, orders: 0, totalSpent: 0, lastOrder: o.createdAt,
        address: `${o.address?.district||''}, ${o.address?.division||''}`,
      };
    }
    customerMap[phone].orders++;
    customerMap[phone].totalSpent += o.total || 0;
    if (new Date(o.createdAt) > new Date(customerMap[phone].lastOrder)) {
      customerMap[phone].lastOrder = o.createdAt;
    }
  });

  const customers = Object.values(customerMap).sort((a,b) => b.totalSpent - a.totalSpent);

  content.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon" style="background:#e3f2fd">👥</div><div><div class="stat-value">${customers.length}</div><div class="stat-label">Total Customers</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">💰</div><div><div class="stat-value">৳${Math.round(customers.reduce((s,c)=>s+c.totalSpent,0)*110/1000)}k</div><div class="stat-label">Total Revenue</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#fff3e0">🛍️</div><div><div class="stat-value">${orders.length}</div><div class="stat-label">Total Orders</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#fce4ec">📊</div><div><div class="stat-value">৳${customers.length ? Math.round(customers.reduce((s,c)=>s+c.totalSpent,0)*110/customers.length).toLocaleString() : 0}</div><div class="stat-label">Avg. Spend</div></div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">👥 All Customers (${customers.length})</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Customer</th><th>Phone</th><th>Address</th><th>Orders</th><th>Total Spent</th><th>Last Order</th></tr></thead>
          <tbody>
            ${customers.length ? customers.map((c,i) => `<tr>
              <td>
                <div style="display:flex;align-items:center;gap:10px">
                  <div style="width:36px;height:36px;background:linear-gradient(135deg,#1a6b2f,#2d9e4f);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex-shrink:0">${c.name[0]||'?'}</div>
                  <div><div style="font-weight:700">${c.name||'Unknown'}</div><span class="badge badge-green" style="font-size:.7rem">#${i+1}</span></div>
                </div>
              </td>
              <td style="font-weight:600">${c.phone}</td>
              <td style="font-size:.85rem;color:#5a6a5a">${c.address}</td>
              <td><span style="font-weight:800;font-size:1rem">${c.orders}</span></td>
              <td style="font-weight:800;color:#1a6b2f">৳${Math.round(c.totalSpent*110).toLocaleString()}</td>
              <td style="font-size:.82rem;color:#5a6a5a">${c.lastOrder ? new Date(c.lastOrder).toLocaleDateString('en-BD') : 'N/A'}</td>
            </tr>`).join('') : '<tr><td colspan="6"><div class="empty"><div class="icon">👥</div><p>No customers yet</p></div></td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function showAddCouponModal() { showPage('coupons'); }

// ===== MODAL =====
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

// ===== TOAST =====
function showToast(msg, type = 'success') {
  const container = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.innerHTML = (type==='success'?'✅':type==='error'?'❌':'⚠️') + ' ' + msg;
  container.appendChild(t);
  setTimeout(() => { t.style.animation = 'slideIn .3s reverse forwards'; setTimeout(()=>t.remove(), 300); }, 3500);
}

// ===== INIT =====
window.onload = async () => {
  await checkServer();
  loadDashboard();
};
</script>
