<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foresstree - Modern E-commerce Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #1a6b2f; --primary-dark: #114a20; --primary-light: #2d9e4f;
  --accent: #f5a623; --accent2: #ff6b35;
  --bg: #f5f7f5; --bg-secondary: #edf2ed; --bg-card: #ffffff;
  --text: #1a1a1a; --text-secondary: #5a6a5a; --border: #dce8dc;
  --shadow: 0 2px 12px rgba(26,107,47,0.08); --radius: 14px;
  --header-bg: rgba(255,255,255,0.95); --sidebar-bg: #0f2818;
  --danger: #e74c3c; --success: #27ae60; --warning: #f39c12; --info: #2196f3;
}
[data-theme="dark"] {
  --bg: #0e1a0e; --bg-secondary: #152115; --bg-card: #1c2d1c;
  --text: #e8f5e8; --text-secondary: #8aab8a; --border: #2a3f2a;
  --shadow: 0 2px 12px rgba(0,0,0,0.4); --header-bg: rgba(21,33,21,0.97); --sidebar-bg: #071207;
}
html { font-size: 14px; scroll-behavior: smooth; }
body { font-family: 'Sora', 'Noto Sans Bengali', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; border: none; font-family: inherit; font-size: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }
img { max-width: 100%; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.header { background: var(--header-bg); border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.header-inner { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; max-width: 1200px; margin: 0 auto; gap: 12px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; cursor: pointer; }
.logo-icon { font-size: 1.7rem; animation: sway 3s ease-in-out infinite; }
@keyframes sway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
.search-bar { flex: 1; max-width: 480px; min-width: 200px; position: relative; }
.search-bar input { width: 100%; padding: 11px 44px 11px 18px; border: 2px solid var(--border); border-radius: 30px; background: var(--bg-secondary); color: var(--text); outline: none; transition: .25s; font-size: .9rem; }
.search-bar input:focus { border-color: var(--primary); background: var(--bg-card); box-shadow: 0 0 0 4px rgba(26,107,47,0.1); }
.search-bar button { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: var(--primary); color: #fff; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; transition: .2s; }
.search-bar button:hover { background: var(--primary-dark); transform: translateY(-50%) scale(1.1); }
.header-actions { display: flex; align-items: center; gap: 6px; }
.header-btn { background: none; color: var(--text); padding: 8px 12px; border-radius: 10px; display: flex; align-items: center; gap: 4px; transition: .2s; position: relative; font-size: .9rem; font-weight: 600; }
.header-btn:hover { background: var(--bg-secondary); color: var(--primary); }
.badge { position: absolute; top: 2px; right: 2px; background: var(--danger); color: #fff; font-size: .6rem; width: 17px; height: 17px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; border: 2px solid var(--bg-card); }
.theme-toggle { background: none; font-size: 1.2rem; padding: 8px; border-radius: 10px; }
.theme-toggle:hover { background: var(--bg-secondary); }
.currency-btn { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: .8rem; font-weight: 700; transition: .2s; }
.currency-btn:hover { border-color: var(--primary); color: var(--primary); }
.nav { background: var(--primary); color: #fff; overflow-x: auto; }
.nav::-webkit-scrollbar { height: 0; }
.nav-inner { display: flex; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 8px; }
.nav-link { padding: 11px 16px; white-space: nowrap; font-size: .85rem; font-weight: 600; transition: .2s; cursor: pointer; opacity: .85; letter-spacing: .2px; }
.nav-link:hover, .nav-link.active { background: rgba(255,255,255,.18); opacity: 1; }
.hero { position: relative; overflow: hidden; min-height: 320px; }
.hero-slides { display: flex; transition: transform .6s cubic-bezier(.77,0,.18,1); }
.hero-slide { min-width: 100%; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 320px; position: relative; }
.hero-slide h1 { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 800; margin-bottom: 12px; text-shadow: 0 2px 8px rgba(0,0,0,.25); animation: fadeUp .7s ease; }
.hero-slide p { font-size: clamp(.95rem, 2.5vw, 1.25rem); opacity: .9; max-width: 580px; margin-bottom: 24px; animation: fadeUp .7s ease .1s both; }
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
.hero-btn { background: #fff; color: var(--primary); padding: 13px 36px; border-radius: 30px; font-weight: 800; font-size: 1rem; transition: .25s; animation: fadeUp .7s ease .2s both; box-shadow: 0 4px 20px rgba(0,0,0,.15); }
.hero-btn:hover { transform: scale(1.06) translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,.2); }
.hero-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.22); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; transition: .2s; backdrop-filter: blur(6px); }
.hero-nav:hover { background: rgba(255,255,255,.4); }
.hero-nav.prev { left: 14px; }
.hero-nav.next { right: 14px; }
.hero-dots { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.hero-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.45); cursor: pointer; transition: .3s; }
.hero-dot.active { background: #fff; width: 26px; border-radius: 5px; }
.trust-strip { background: var(--primary-dark); color: rgba(255,255,255,.9); padding: 10px 0; }
.trust-inner { display: flex; justify-content: center; gap: 40px; max-width: 1200px; margin: 0 auto; padding: 0 16px; flex-wrap: wrap; }
.trust-item { display: flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
.section { padding: 36px 0; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 8px; }
.section-title { font-size: 1.45rem; font-weight: 800; color: var(--text); letter-spacing: -.3px; }
.section-link { color: var(--primary); font-weight: 700; font-size: .88rem; }
.section-link:hover { text-decoration: underline; }
.categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 12px; }
.category-card { text-align: center; padding: 18px 8px; background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: .25s; }
.category-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 8px 24px rgba(26,107,47,.12); }
.category-card:hover .category-icon { transform: scale(1.2); }
.category-icon { font-size: 2rem; margin-bottom: 7px; transition: .25s; display: block; }
.category-name { font-size: .78rem; font-weight: 700; color: var(--text-secondary); }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 16px; }
.product-card { background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: .25s; cursor: pointer; position: relative; }
.product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(26,107,47,.12); border-color: var(--primary-light); }
.product-badge { position: absolute; top: 9px; left: 9px; background: var(--danger); color: #fff; padding: 3px 9px; border-radius: 6px; font-size: .7rem; font-weight: 800; z-index: 2; }
.product-badge.new { background: var(--info); }
.product-wishlist { position: absolute; top: 9px; right: 9px; background: var(--bg-card); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.12); transition: .2s; }
.product-wishlist:hover, .product-wishlist.active { background: #fde8e8; }
.product-image { height: 175px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; font-size: 4.5rem; position: relative; overflow: hidden; transition: .3s; }
.product-card:hover .product-image { background: var(--bg); }
.product-compare { position: absolute; bottom: 8px; left: 8px; display: flex; align-items: center; gap: 4px; font-size: .7rem; background: rgba(255,255,255,.9); padding: 3px 7px; border-radius: 20px; z-index: 2; color: var(--text); font-weight: 600; opacity: 0; transition: .2s; }
.product-card:hover .product-compare { opacity: 1; }
.product-compare input { accent-color: var(--primary); }
.product-info { padding: 12px; }
.product-category { font-size: .68rem; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: .7px; }
.product-name { font-size: .92rem; font-weight: 700; margin: 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
.product-rating { display: flex; align-items: center; gap: 4px; font-size: .78rem; color: var(--accent); margin: 4px 0; }
.product-rating span { color: var(--text-secondary); }
.product-price { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
.price-current { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
.price-original { font-size: .82rem; color: var(--text-secondary); text-decoration: line-through; }
.product-actions { display: flex; gap: 6px; margin-top: 8px; }
.btn-add-cart { flex: 1; background: var(--primary); color: #fff; padding: 9px; border-radius: 9px; font-weight: 700; font-size: .8rem; transition: .2s; display: flex; align-items: center; justify-content: center; gap: 4px; }
.btn-add-cart:hover { background: var(--primary-dark); }
.btn-quick-view { background: var(--bg-secondary); color: var(--text); padding: 9px 10px; border-radius: 9px; font-size: .8rem; transition: .2s; border: 1px solid var(--border); }
.btn-quick-view:hover { background: var(--border); }
.flash-banner { background: linear-gradient(135deg, #c0392b, #e74c3c, #ff6b35); color: #fff; border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; box-shadow: 0 6px 24px rgba(231,76,60,.3); }
.flash-title { font-size: 1.25rem; font-weight: 800; }
.flash-timer { display: flex; gap: 7px; }
.flash-timer div { background: rgba(0,0,0,.25); padding: 7px 10px; border-radius: 8px; text-align: center; min-width: 48px; }
.flash-timer .num { font-size: 1.25rem; font-weight: 800; display: block; }
.flash-timer .label { font-size: .6rem; opacity: .85; }
.recently-viewed-bar { background: var(--bg-card); border-top: 2px solid var(--border); border-bottom: 2px solid var(--border); padding: 12px 0; }
.recently-viewed-inner { display: flex; align-items: center; gap: 12px; max-width: 1200px; margin: 0 auto; padding: 0 16px; overflow-x: auto; }
.recently-viewed-inner::-webkit-scrollbar { height: 0; }
.recently-viewed-label { font-size: .8rem; font-weight: 700; color: var(--text-secondary); white-space: nowrap; }
.recently-item { display: flex; align-items: center; gap: 8px; background: var(--bg-secondary); padding: 7px 12px; border-radius: 30px; white-space: nowrap; cursor: pointer; transition: .2s; border: 1px solid var(--border); font-size: .8rem; font-weight: 600; }
.recently-item:hover { border-color: var(--primary); color: var(--primary); }
.shop-layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; padding: 24px 0; }
.shop-sidebar { position: sticky; top: 80px; align-self: start; }
.filter-group { margin-bottom: 16px; background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); padding: 16px; }
.filter-title { font-weight: 800; margin-bottom: 10px; font-size: .92rem; }
.filter-option { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: .85rem; cursor: pointer; color: var(--text-secondary); transition: .15s; }
.filter-option:hover { color: var(--text); }
.filter-option input { accent-color: var(--primary); }
.price-range { display: flex; gap: 8px; align-items: center; }
.price-range input { width: 80px; padding: 7px 9px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
.shop-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.shop-count { font-size: .88rem; color: var(--text-secondary); font-weight: 600; }
.shop-sort select { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); font-weight: 600; }
.product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0; }
.pd-gallery { display: flex; flex-direction: column; gap: 12px; }
.pd-main-img { background: var(--bg-secondary); border-radius: var(--radius); height: 420px; display: flex; align-items: center; justify-content: center; font-size: 9rem; border: 2px solid var(--border); overflow: hidden; }
.pd-thumbs { display: flex; gap: 8px; }
.pd-thumb { width: 72px; height: 72px; background: var(--bg-secondary); border: 2.5px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; overflow: hidden; }
.pd-thumb.active { border-color: var(--primary); }
.pd-info h1 { font-size: 1.55rem; font-weight: 800; margin-bottom: 8px; line-height: 1.3; }
.pd-rating { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: .9rem; }
.pd-price { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pd-price .original { font-size: 1.1rem; color: var(--text-secondary); text-decoration: line-through; font-weight: 400; }
.pd-price .discount { background: var(--danger); color: #fff; font-size: .75rem; padding: 3px 9px; border-radius: 5px; font-weight: 700; }
.pd-stock { display: inline-flex; align-items: center; gap: 5px; padding: 5px 14px; border-radius: 22px; font-size: .8rem; font-weight: 700; margin-bottom: 16px; }
.pd-stock.in-stock { background: #e8f5e9; color: var(--success); }
.pd-stock.low-stock { background: #fff8e1; color: var(--warning); }
.pd-desc { color: var(--text-secondary); margin-bottom: 20px; font-size: .93rem; line-height: 1.75; }
.pd-quantity { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.qty-control { display: flex; align-items: center; border: 2px solid var(--border); border-radius: 10px; overflow: hidden; }
.qty-btn { width: 38px; height: 38px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: .2s; font-weight: 700; }
.qty-btn:hover { background: var(--primary); color: #fff; }
.qty-val { width: 52px; text-align: center; border: none; background: var(--bg); color: var(--text); font-weight: 700; font-size: .95rem; }
.pd-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.btn-primary { background: var(--primary); color: #fff; padding: 12px 28px; border-radius: 11px; font-weight: 700; font-size: 1rem; transition: .2s; display: flex; align-items: center; gap: 6px; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,107,47,.25); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.btn-outline { background: none; border: 2.5px solid var(--primary); color: var(--primary); padding: 11px 28px; border-radius: 11px; font-weight: 700; font-size: 1rem; transition: .2s; display: flex; align-items: center; gap: 6px; }
.btn-outline:hover { background: var(--primary); color: #fff; }
.pd-info-box { background: var(--bg-secondary); border-radius: 10px; padding: 14px; font-size: .85rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border); }
.pd-info-box div { display: flex; align-items: center; gap: 8px; }
.share-buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.share-btn { padding: 7px 14px; border-radius: 8px; font-size: .78rem; font-weight: 700; transition: .2s; display: flex; align-items: center; gap: 5px; }
.share-fb { background: #1877f2; color: #fff; }
.share-wa { background: #25d366; color: #fff; }
.share-copy { background: var(--bg-secondary); color: var(--text); border: 1px solid var(--border); }
.reviews-section { padding: 24px 0; }
.review-card { background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.review-user { font-weight: 700; }
.review-date { font-size: .78rem; color: var(--text-secondary); }
.review-stars { color: var(--accent); margin-bottom: 6px; }
.review-text { color: var(--text-secondary); font-size: .9rem; line-height: 1.6; }
.review-helpful { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .78rem; color: var(--text-secondary); }
.review-helpful button { background: var(--bg-secondary); border: 1px solid var(--border); padding: 3px 10px; border-radius: 5px; font-size: .75rem; transition: .2s; }
.review-helpful button:hover { background: var(--primary); color: #fff; }
.cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; padding: 24px 0; }
.cart-item { display: flex; gap: 16px; padding: 16px; background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; align-items: center; }
.cart-item:hover { border-color: var(--primary-light); }
.cart-item-img { width: 82px; height: 82px; background: var(--bg-secondary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; flex-shrink: 0; overflow: hidden; }
.cart-item-info { flex: 1; }
.cart-item-name { font-weight: 700; font-size: .93rem; }
.cart-item-price { color: var(--primary); font-weight: 700; margin-top: 4px; font-size: 1rem; }
.cart-item-actions { display: flex; align-items: center; gap: 12px; }
.cart-remove { color: var(--danger); font-size: .8rem; cursor: pointer; padding: 5px 10px; border-radius: 6px; background: none; transition: .2s; }
.cart-remove:hover { background: #fde8e8; }
.cart-summary { background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px; position: sticky; top: 80px; }
.cart-summary h3 { font-size: 1.1rem; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--border); font-weight: 800; }
.summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: .9rem; }
.summary-row.total { font-size: 1.1rem; font-weight: 800; color: var(--primary); border-top: 2px solid var(--border); padding-top: 12px; margin-top: 8px; }
.coupon-input { display: flex; gap: 6px; margin-bottom: 16px; }
.coupon-input input { flex: 1; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); font-size: .88rem; }
.coupon-input input:focus { border-color: var(--primary); outline: none; }
.coupon-input button { background: var(--primary); color: #fff; padding: 9px 16px; border-radius: 9px; font-weight: 700; font-size: .83rem; white-space: nowrap; transition: .2s; }
.coupon-input button:hover { background: var(--primary-dark); }
.checkout-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; padding: 24px 0; }
.checkout-section { background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.checkout-section h3 { font-size: 1.05rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; font-weight: 800; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: .8rem; font-weight: 700; color: var(--text-secondary); }
.form-group input, .form-group select, .form-group textarea { padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); outline: none; transition: .2s; }
.form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,107,47,.1); }
.payment-options { display: flex; flex-direction: column; gap: 9px; }
.payment-option { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: .2s; }
.payment-option:hover { border-color: var(--primary-light); }
.payment-option.selected { border-color: var(--primary); background: rgba(26,107,47,.05); }
.payment-option input { accent-color: var(--primary); }
.payment-logo { font-size: 1.4rem; }
.payment-name { font-weight: 700; font-size: .9rem; }
.payment-desc { font-size: .75rem; color: var(--text-secondary); margin-top: 1px; }
.auth-container { max-width: 420px; margin: 40px auto; padding: 0 16px; }
.auth-card { background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); padding: 34px; box-shadow: 0 8px 40px rgba(0,0,0,.08); }
.auth-card h2 { text-align: center; margin-bottom: 6px; font-size: 1.5rem; font-weight: 800; }
.auth-card .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 26px; font-size: .9rem; }
.auth-card .form-group { margin-bottom: 14px; }
.auth-card .form-group label { font-size: .85rem; }

<body>

<!-- Loading Screen -->
<div id="loadingScreen">
  <div style="font-size:2.5rem;animation:sway 3s ease-in-out infinite">🌳</div>
  <div class="loading-spinner"></div>
  <p style="color:var(--text-secondary);font-size:.9rem">Loading Foresstree...</p>
</div>

<div id="app"></div>
<div class="toast-container" id="toasts"></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>
<button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="compare-bar" id="compareBar">
  <span style="font-weight:700;font-size:.9rem;white-space:nowrap">🔍 Compare:</span>
  <div class="compare-bar-items" id="compareItems"></div>
  <button class="btn-primary" style="padding:8px 18px;font-size:.85rem" onclick="App.openCompare()">Compare Now</button>
  <button style="background:rgba(255,255,255,.2);color:#fff;padding:8px 14px;border-radius:8px;font-size:.8rem" onclick="App.clearCompare()">Clear</button>
</div>

<script>
const API = 'https://foresstree.onrender.com/api';

const App = {
  state: {
    page: 'home', theme: 'light', user: null, isAdmin: false,
    cart: [], wishlist: [], compare: [], recentlyViewed: [], searchQuery: '',
    selectedCategory: 'all', sortBy: 'featured', priceRange: [0, 50000],
    currentSlide: 0, productDetail: null, profileTab: 'orders', qty: 1,
    adminSidebarOpen: false, currentPage: 1, perPage: 8, currency: 'BDT',
    couponApplied: null, lastOrder: null, myOrders: [],
  },
  exchangeRate: 110,

  formatPrice(usd) {
    if (this.state.currency === 'BDT') return '৳' + Math.round(usd * this.exchangeRate).toLocaleString('en-BD');
    return '$' + usd.toFixed(2);
  },

  categories: [
    {id:'electronics',name:'Electronics',icon:'📱'},
    {id:'fashion',name:'Fashion',icon:'👔'},
    {id:'home',name:'Home & Garden',icon:'🏡'},
    {id:'sports',name:'Sports',icon:'⚽'},
    {id:'books',name:'Books',icon:'📚'},
    {id:'beauty',name:'Beauty',icon:'💄'},
    {id:'toys',name:'Toys',icon:'🧸'},
    {id:'food',name:'Groceries',icon:'🥑'},
    {id:'auto',name:'Automotive',icon:'🚗'},
    {id:'health',name:'Health',icon:'💊'},
  ],

  products: [], reviews: [],
  coupons: [
    {code:'SAVE10',discount:10,type:'percent',active:true},
    {code:'FLAT500',discount:500,type:'fixed',active:true},
    {code:'WELCOME',discount:15,type:'percent',active:true},
  ],

  // ✅ App শুরু — database থেকে products আনো
  async init() {
    try {
      const res = await fetch(`${API}/products`);
      const dbProducts = await res.json();
      if (Array.isArray(dbProducts) && dbProducts.length > 0) {
        this.products = dbProducts.map((p, i) => ({
          id: p._id, name: p.name, category: p.category,
          icon: p.icon || '📦', image: p.image || '',
          price: Number(p.price),
          originalPrice: Number(p.originalPrice) || Number(p.price),
          rating: p.rating || 4.0, reviews: p.reviews || 0,
          stock: Number(p.stock) || 0, sold: p.sold || 0,
          description: p.description || '',
          isFlash: i < 6, isTrending: i % 3 === 0,
          isFeatured: p.isFeatured === 'true' || p.isFeatured === true,
          isNew: p.isNew === 'true' || p.isNew === true,
          freeShipping: p.freeShipping === 'true' || p.freeShipping === true || Number(p.price) > 45,
        }));
      } else {
        this.generateProducts();
      }
    } catch (e) {
      this.generateProducts();
    }

    this.generateReviews();

    // Theme
    const savedTheme = localStorage.getItem('foresstree-theme');
    if (savedTheme) {
      this.state.theme = savedTheme;
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    // Cart from localStorage
    const savedCart = localStorage.getItem('foresstree-cart');
    if (savedCart) { try { this.state.cart = JSON.parse(savedCart); } catch(e){} }

    // Wishlist from localStorage
    const savedWish = localStorage.getItem('foresstree-wishlist');
    if (savedWish) { try { this.state.wishlist = JSON.parse(savedWish); } catch(e){} }

    // Loading screen সরাও
    const ls = document.getElementById('loadingScreen');
    if (ls) { ls.style.opacity = '0'; ls.style.transition = '.5s'; setTimeout(() => ls.style.display = 'none', 500); }

    this.render();
    this.startSlider();
    this.startFlashTimer();
    this.setupBackToTop();
  },

  setupBackToTop() {
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('backToTop');
      if (btn) btn.classList.toggle('show', window.scrollY > 400);
    });
  },

  // Dummy products
  generateProducts() {
    const names = [
      ['Wireless Earbuds Pro','electronics','🎧',72.72,90.90],

  navigate(page, data) {
    this.state.page = page;
    if (data) Object.assign(this.state, data);
    this.state.currentPage = 1;
    if (page === 'product' && data && data.productDetail) this.addToRecentlyViewed(data.productDetail);
    this.render();
    window.scrollTo(0, 0);
  },

  addToRecentlyViewed(id) {
    this.state.recentlyViewed = [id,...this.state.recentlyViewed.filter(x=>x!==id)].slice(0,6);
  },

  toggleTheme() {
    this.state.theme = this.state.theme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', this.state.theme);
    localStorage.setItem('foresstree-theme', this.state.theme);
    this.render();
  },

  toggleCurrency() {
    this.state.currency = this.state.currency === 'BDT' ? 'USD' : 'BDT';
    this.toast(`Currency: ${this.state.currency}`, 'info');
    this.render();
  },

  toast(msg, type = 'success') {
    const icons = {success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.innerHTML = icons[type] + ' ' + msg;
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => { t.style.animation = 'slideIn .35s reverse forwards'; setTimeout(()=>t.remove(), 350); }, 3000);
  },

  showModal(html) { document.getElementById('modal-content').innerHTML = html; document.getElementById('modal-overlay').classList.add('show'); },
  closeModal() { document.getElementById('modal-overlay').classList.remove('show'); },

  // ✅ Cart — localStorage এ save হবে
  addToCart(id) {
    const existing = this.state.cart.find(c => c.id === id);
    if (existing) { existing.quantity++; }
    else {
      const p = this.products.find(p => p.id === id);
      if (p) this.state.cart.push({...p, quantity: 1});
    }
    localStorage.setItem('foresstree-cart', JSON.stringify(this.state.cart));
    this.toast('Added to cart! 🛒');
    this.render();
  },

  removeFromCart(id) {
    this.state.cart = this.state.cart.filter(c => c.id !== id);
    localStorage.setItem('foresstree-cart', JSON.stringify(this.state.cart));
    this.toast('Removed from cart', 'warning');
    this.render();
  },

  updateCartQty(id, delta) {
    const item = this.state.cart.find(c => c.id === id);
    if (item) item.quantity = Math.max(1, item.quantity + delta);
    localStorage.setItem('foresstree-cart', JSON.stringify(this.state.cart));
    this.render();
  },

  // ✅ Wishlist — localStorage এ save হবে
  toggleWishlist(id) {
    const idx = this.state.wishlist.indexOf(id);
    if (idx > -1) { this.state.wishlist.splice(idx, 1); this.toast('Removed from wishlist', 'warning'); }
    else { this.state.wishlist.push(id); this.toast('Added to wishlist! ❤️'); }
    localStorage.setItem('foresstree-wishlist', JSON.stringify(this.state.wishlist));
    this.render();
  },

  toggleCompare(id) {
    const idx = this.state.compare.indexOf(id);
    if (idx > -1) { this.state.compare.splice(idx, 1); }
    else {
      if (this.state.compare.length >= 3) { this.toast('Maximum 3 products', 'warning'); return; }
      this.state.compare.push(id);
    }
    this.updateCompareBar();
    this.render();
  },

  updateCompareBar() {
    const bar = document.getElementById('compareBar');
    const itemsEl = document.getElementById('compareItems');
    if (!bar || !itemsEl) return;
    if (this.state.compare.length > 0) {
      bar.classList.add('show');
      itemsEl.innerHTML = this.state.compare.map(id => {
        const p = this.products.find(x => x.id === id);
        if (!p) return '';
        return `<div class="compare-item-chip">${p.icon} ${p.name.split(' ').slice(0,2).join(' ')}<button onclick="App.toggleCompare('${id}')" style="background:none;color:rgba(255,255,255,.7);margin-left:4px">✕</button></div>`;
      }).join('');
    } else { bar.classList.remove('show'); }
  },

  clearCompare() { this.state.compare = []; this.updateCompareBar(); this.render(); },

  openCompare() {
    if (this.state.compare.length < 2) { this.toast('Select at least 2 products', 'warning'); return; }
    const prods = this.state.compare.map(id => this.products.find(p => p.id === id)).filter(Boolean);
    const keys = ['name','category','price','rating','stock'];
    const labels = ['Product','Category','Price','Rating','Stock'];
    let html = `<button class="modal-close" onclick="App.closeModal()">✕</button>
    <h2>🔍 Compare Products</h2>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
      <thead><tr><th style="padding:10px;text-align:left;font-size:.8rem;color:var(--text-secondary)"></th>
        ${prods.map(p=>`<th style="padding:10px;text-align:center">
          <div style="font-size:2rem">${p.image?`<img src="${p.image}" style="width:50px;height:50px;object-fit:cover;border-radius:8px">`:p.icon}</div>
          <div style="font-weight:800;font-size:.85rem;margin-top:6px">${p.name}</div>
        </th>`).join('')}
      </tr></thead>
      <tbody>
        ${keys.map((k,i) => `<tr style="border-top:1px solid var(--border)">
          <td style="padding:10px;font-size:.82rem;font-weight:700;color:var(--text-secondary)">${labels[i]}</td>
          ${prods.map(p=>`<td style="padding:10px;text-align:center;font-weight:600">${k==='price'?this.formatPrice(p[k]):k==='rating'?'⭐ '+p[k]:p[k]}</td>`).join('')}
        </tr>`).join('')}
        <tr style="border-top:2px solid var(--border)"><td></td>
          ${prods.map(p=>`<td style="padding:10px;text-align:center">
            <button class="btn-add-cart" style="font-size:.8rem" onclick="App.addToCart('${p.id}');App.closeModal()">🛒 Add to Cart</button>
          </td>`).join('')}
        </tr>
      </tbody>
    </table></div>`;
    this.showModal(html);
  },

  getCartTotal() {
    let total = this.state.cart.reduce((s,i) => s + i.price * i.quantity, 0);
    if (this.state.couponApplied) {
      const c = this.coupons.find(x => x.code === this.state.couponApplied);
      if (c) {
        if (c.type === 'percent') total = total * (1 - c.discount / 100);
        else total = Math.max(0, total - c.discount / this.exchangeRate);
      }
    }
    return total;
  },

  getFilteredProducts() {
    let prods = [...this.products];
    if (this.state.selectedCategory !== 'all') prods = prods.filter(p => p.category === this.state.selectedCategory);
    if (this.state.searchQuery) {
      const q = this.state.searchQuery.toLowerCase();
      prods = prods.filter(p => p.name.toLowerCase().includes(q) || p.category.includes(q));
    }
    const [min, max] = this.state.priceRange;
    prods = prods.filter(p => p.price >= min && p.price <= max);
    switch (this.state.sortBy) {
      case 'price-low': prods.sort((a,b) => a.price - b.price); break;
      case 'price-high': prods.sort((a,b) => b.price - a.price); break;
      case 'rating': prods.sort((a,b) => b.rating - a.rating); break;
      case 'newest': prods.sort((a,b) => String(b.id).localeCompare(String(a.id))); break;
      case 'bestselling': prods.sort((a,b) => b.sold - a.sold); break;
    }
    return prods;
  },

  renderStars(r) { let s=''; for(let i=1;i<=5;i++) s+=i<=Math.floor(r)?'⭐':'☆'; return s; },

  renderProductCard(p) {
    const inWish = this.state.wishlist.includes(p.id);
    const inCompare = this.state.compare.includes(p.id);
    const discount = Math.round((1 - p.price / p.originalPrice) * 100);
    const idStr = typeof p.id === 'string' ? `'${p.id}'` : p.id;
    return `<div class="product-card" onclick="App.navigate('product',{productDetail:${idStr}})">
      ${discount > 0 ? `<div class="product-badge">-${discount}%</div>` : ''}
      ${p.isNew ? `<div class="product-badge new" style="top:${discount>0?'34':'9'}px">NEW</div>` : ''}
      <button class="product-wishlist ${inWish?'active':''}" onclick="event.stopPropagation();App.toggleWishlist(${idStr})">${inWish?'❤️':'🤍'}</button>
      <div class="product-image">
        ${p.image ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover" alt="${p.name}">` : p.icon}
        <label class="product-compare" onclick="event.stopPropagation()">
          <input type="checkbox" ${inCompare?'checked':''} onchange="App.toggleCompare(${idStr})"> Compare
        </label>
      </div>
      <div class="product-info">
        <div class="product-category">${p.category}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-rating">${this.renderStars(p.rating)} <span>(${p.reviews})</span></div>
        <div class="product-price">
          <span class="price-current">${this.formatPrice(p.price)}</span>
          ${p.originalPrice > p.price ? `<span class="price-original">${this.formatPrice(p.originalPrice)}</span>` : ''}

        ${p.freeShipping ? `<div style="font-size:.7rem;color:var(--success);font-weight:700;margin-top:2px">🚚 Free Shipping</div>` : ''}
        <div class="product-actions">
          <button class="btn-add-cart" onclick="event.stopPropagation();App.addToCart(${idStr})">🛒 Cart</button>
          <button class="btn-quick-view" onclick="event.stopPropagation();App.quickView(${idStr})" title="Quick View">👁️</button>
        </div>
      </div>
    </div>`;
  },

  quickView(id) {
    const p = this.products.find(x => x.id === id);
    if (!p) return;
    const discount = Math.round((1 - p.price / p.originalPrice) * 100);
    const idStr = typeof p.id === 'string' ? `'${p.id}'` : p.id;
    this.showModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start">
        <div style="background:var(--bg-secondary);border-radius:12px;height:220px;display:flex;align-items:center;justify-content:center;font-size:7rem;overflow:hidden">
          ${p.image ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">` : p.icon}
        </div>
        <div>
          <div style="font-size:.7rem;color:var(--primary);font-weight:700;text-transform:uppercase">${p.category}</div>
          <h3 style="margin:6px 0;font-size:1.1rem;font-weight:800">${p.name}</h3>
          <div style="color:var(--accent);font-size:.85rem">${this.renderStars(p.rating)} <span style="color:var(--text-secondary)">(${p.reviews})</span></div>
          <div style="font-size:1.5rem;font-weight:800;color:var(--primary);margin:10px 0">
            ${this.formatPrice(p.price)}
            ${p.originalPrice > p.price ? `<span style="font-size:.9rem;color:var(--text-secondary);text-decoration:line-through;margin-left:8px">${this.formatPrice(p.originalPrice)}</span>` : ''}
            ${discount > 0 ? `<span style="font-size:.75rem;background:var(--danger);color:#fff;padding:2px 8px;border-radius:5px;font-weight:700;margin-left:6px">-${discount}%</span>` : ''}
          </div>
          <p style="font-size:.85rem;color:var(--text-secondary);line-height:1.6">${p.description}</p>
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
            <button class="btn-primary" style="font-size:.88rem;padding:10px 20px" onclick="App.addToCart(${idStr});App.closeModal()">🛒 Add to Cart</button>
            <button class="btn-outline" style="font-size:.88rem;padding:10px 20px" onclick="App.navigate('product',{productDetail:${idStr}});App.closeModal()">View Details</button>
          </div>
        </div>
      </div>
    `);
  },

  startSlider() {
    setInterval(() => { this.state.currentSlide = (this.state.currentSlide + 1) % 3; this._updateSlider(); }, 4500);
  },
  _updateSlider() {
    const el = document.getElementById('hero-slides');
    if (el) el.style.transform = `translateX(-${this.state.currentSlide * 100}%)`;
    document.querySelectorAll('.hero-dot').forEach((d,i) => d.classList.toggle('active', i === this.state.currentSlide));
  },
  slideHero(dir) { this.state.currentSlide = (this.state.currentSlide + dir + 3) % 3; this._updateSlider(); },

  startFlashTimer() {
    setInterval(() => {
      const el = document.getElementById('flash-timer');
      if (el) {
        const now = new Date(); const end = new Date(now); end.setHours(23,59,59);
        const diff = end - now;
        const h = Math.floor(diff/3600000); const m = Math.floor((diff%3600000)/60000); const s = Math.floor((diff%60000)/1000);
        el.innerHTML = `<div><span class="num">${String(h).padStart(2,'0')}</span><span class="label">HRS</span></div><div><span class="num">${String(m).padStart(2,'0')}</span><span class="label">MIN</span></div><div><span class="num">${String(s).padStart(2,'0')}</span><span class="label">SEC</span></div>`;
      }
    }, 1000);
  },

  login(isAdmin) {
    this.state.user = {name: isAdmin?'Admin':'Rahim Ahmed', email: isAdmin?'admin@foresstree.com':'rahim@gmail.com', phone:'01712345678'};
    this.state.isAdmin = isAdmin;
    this.toast('Welcome back, '+this.state.user.name+'! 👋');
    this.navigate(isAdmin ? 'admin' : 'home');
  },

  logout() {
    this.state.user = null; this.state.isAdmin = false;
    this.toast('Logged out', 'warning');
    this.navigate('home');
  },

  applyCoupon(code) {
    const coupon = this.coupons.find(c => c.code === code.toUpperCase() && c.active);
    if (coupon) {
      this.state.couponApplied = coupon.code;
      this.toast(`Coupon applied! ${coupon.type==='percent'?coupon.discount+'% off':this.formatPrice(coupon.discount/this.exchangeRate)+' off'}`);
      this.render();
    } else { this.toast('Invalid coupon code', 'error'); }
  },

  render() {
    const s = this.state;
    let html = '';
    if (s.page === 'admin' && s.isAdmin) { html = this.renderAdmin(); }
    else {
      html = this.renderHeader();
      html += this.renderNav();
      if (s.recentlyViewed.length > 0 && s.page !== 'home') html += this.renderRecentlyViewed();
      html += `<main>`;
      switch (s.page) {
        case 'home': html += this.renderHome(); break;
        case 'shop': html += this.renderShop(); break;
        case 'product': html += this.renderProductDetail(); break;
        case 'cart': html += this.renderCart(); break;
        case 'checkout': html += this.renderCheckout(); break;
        case 'order-success': html += this.renderOrderSuccess(); break;
        case 'login': html += this.renderLogin(); break;
        case 'register': html += this.renderRegister(); break;
        case 'profile': html += this.renderProfile(); break;
        case 'wishlist': html += this.renderWishlistPage(); break;
      }
      html += `</main>`;
      html += this.renderFooter();
    }
    document.getElementById('app').innerHTML = html;
    this.updateCompareBar();
  },

  renderHeader() {
    const cartCount = this.state.cart.reduce((s,i) => s + i.quantity, 0);
    return `<header class="header">
      <div class="header-inner">
        <button class="mobile-menu-btn" onclick="document.querySelector('.nav').classList.toggle('hidden')">☰</button>
        <a class="logo" onclick="App.navigate('home')"><span class="logo-icon">🌳</span>Foresstree</a>
        <div class="search-bar">
          <input type="text" placeholder="Search products..." value="${this.state.searchQuery}"
            oninput="App.state.searchQuery=this.value"
            onkeydown="if(event.key==='Enter')App.navigate('shop')">
          <button onclick="App.navigate('shop')">🔍</button>
        </div>
        <div class="header-actions">
          <button class="theme-toggle" onclick="App.toggleTheme()">${this.state.theme==='light'?'🌙':'☀️'}</button>

          <button class="header-btn" onclick="App.navigate('wishlist')">❤️ ${this.state.wishlist.length>0?`<span class="badge">${this.state.wishlist.length}</span>`:''}</button>
          <button class="header-btn" onclick="App.navigate('cart')">🛒 ${cartCount>0?`<span class="badge">${cartCount}</span>`:''}</button>
          ${this.state.user
            ? `<button class="header-btn" onclick="App.navigate('profile')">👤 ${this.state.user.name.split(' ')[0]}</button>

            : `<button class="header-btn" onclick="App.navigate('login')">👤 Login</button>`}
        </div>
      </div>
    </header>`;
  },

  renderNav() {
    const links = [
      {page:'home',label:'Home'},
      {page:'shop',label:'All Products'},
      ...this.categories.slice(0,7).map(c => ({page:'shop',label:c.name,cat:c.id}))

    return `<nav class="nav">
      <div class="nav-inner">
        ${links.map(l => `<a class="nav-link ${this.state.page===l.page&&!l.cat?'active':''}"

        ${this.state.user ? `<a class="nav-link" onclick="window.location.href='admin.html'" style="margin-left:auto;background:rgba(255,255,255,.15)">🔧 Admin Panel</a>` : ''}
      </div>
    </nav>`;
  },

  renderRecentlyViewed() {
    const prods = this.state.recentlyViewed.map(id => this.products.find(p => p.id === id)).filter(Boolean);

    return `<div class="recently-viewed-bar">
      <div class="recently-viewed-inner">
        <span class="recently-viewed-label">👁️ Recently Viewed:</span>

          ${p.name.split(' ').slice(0,2).join(' ')}
        </div>`).join('')}
      </div>
    </div>`;
  },

    return `

          <button class="hero-btn" onclick="App.navigate('shop')">Shop Now →</button>
        </div>

          <button class="hero-btn" onclick="App.navigate('shop',{sortBy:'newest'})">Explore →</button>
        </div>
      </div>
      <button class="hero-nav prev" onclick="App.slideHero(-1)">‹</button>

  renderCart() {
    if (this.state.cart.length === 0) {
      return `<div class="container">
        <div class="breadcrumb"><a onclick="App.navigate('home')">Home</a> › Cart</div>
        <div class="empty-state"><div class="icon">🛒</div><h3>Your cart is empty</h3>
          <p style="margin:8px 0 20px">You haven't added any products yet.</p>
          <button class="btn-primary" onclick="App.navigate('shop')">Continue Shopping →</button>
        </div>
      </div>`;
    }
    const subtotal = this.state.cart.reduce((s,i) => s + i.price * i.quantity, 0);
    const couponDiscount = this.state.couponApplied ? (() => {
      const c = this.coupons.find(x => x.code === this.state.couponApplied);
      if (!c) return 0;
      return c.type === 'percent' ? subtotal * (c.discount / 100) : c.discount / this.exchangeRate;
    })() : 0;
    const afterCoupon = subtotal - couponDiscount;
    const shipping = afterCoupon > 45 ? 0 : 3.63;
    const tax = afterCoupon * 0.05;
    const total = afterCoupon + shipping + tax;
    return `<div class="container">
      <div class="breadcrumb"><a onclick="App.navigate('home')">Home</a> › Cart</div>
      <h2 style="margin-bottom:18px;font-size:1.3rem;font-weight:800">🛒 Shopping Cart <span style="font-size:1rem;font-weight:600;color:var(--text-secondary)">(${this.state.cart.reduce((s,i)=>s+i.quantity,0)} items)</span></h2>
      <div class="cart-layout">
        <div>
          ${this.state.cart.map(item => {
            const idStr = typeof item.id === 'string' ? `'${item.id}'` : item.id;
            return `<div class="cart-item">
              <div class="cart-item-img">${item.image?`<img src="${item.image}" style="width:100%;height:100%;object-fit:cover">`:item.icon}</div>
              <div class="cart-item-info">
                <div class="cart-item-name">${item.name}</div>
                <div style="font-size:.78rem;color:var(--text-secondary)">${item.category}</div>
                <div class="cart-item-price">${this.formatPrice(item.price)}</div>
                ${item.freeShipping?'<div style="font-size:.72rem;color:var(--success);font-weight:700">🚚 Free Shipping</div>':''}
              </div>
              <div class="cart-item-actions">
                <div class="qty-control">
                  <button class="qty-btn" onclick="App.updateCartQty(${idStr},-1)">−</button>
                  <input class="qty-val" value="${item.quantity}" readonly>
                  <button class="qty-btn" onclick="App.updateCartQty(${idStr},1)">+</button>
                </div>
                <div style="font-weight:800;min-width:80px;text-align:right">${this.formatPrice(item.price*item.quantity)}</div>
                <button class="cart-remove" onclick="App.removeFromCart(${idStr})">🗑️ Remove</button>
              </div>
            </div>`;
          }).join('')}
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn-outline" style="font-size:.88rem;padding:10px 20px" onclick="App.navigate('shop')">← Continue Shopping</button>
            <button style="background:var(--bg-secondary);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:.85rem;font-weight:700" onclick="App.state.cart=[];localStorage.removeItem('foresstree-cart');App.render();App.toast('Cart cleared','warning')">🗑️ Clear Cart</button>
          </div>
        </div>
        <div class="cart-summary">
          <h3>Order Summary</h3>
          <div class="coupon-input">
            <input type="text" placeholder="Coupon code (e.g. SAVE10)" id="coupon-input" value="${this.state.couponApplied||''}">
            <button onclick="App.applyCoupon(document.getElementById('coupon-input').value)">Apply</button>
          </div>
          ${this.state.couponApplied?`<div style="background:#e8f5e9;padding:8px 12px;border-radius:8px;font-size:.82rem;color:var(--success);font-weight:700;margin-bottom:12px">✅ Coupon applied! <button onclick="App.state.couponApplied=null;App.render()" style="background:none;color:var(--danger);margin-left:8px;font-size:.75rem">Remove</button></div>`:''}
          <div class="summary-row"><span>Subtotal</span><span>${this.formatPrice(subtotal)}</span></div>
          ${couponDiscount>0?`<div class="summary-row" style="color:var(--success)"><span>Discount</span><span>−${this.formatPrice(couponDiscount)}</span></div>`:''}
          <div class="summary-row"><span>Shipping</span><span>${shipping===0?'<span style="color:var(--success);font-weight:700">FREE</span>':this.formatPrice(shipping)}</span></div>
          <div class="summary-row"><span>VAT (5%)</span><span>${this.formatPrice(tax)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${this.formatPrice(total)}</span></div>
          <button class="btn-primary" style="width:100%;justify-content:center;margin-top:14px;padding:14px" onclick="App.navigate('checkout')">Proceed to Checkout →</button>
          <div style="text-align:center;margin-top:10px;font-size:.78rem;color:var(--text-secondary)">🔒 Secure & encrypted checkout</div>
          <div style="display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap">
            <span style="font-size:1.2rem" title="bKash">💚</span>
            <span style="font-size:1.2rem" title="Nagad">🟠</span>
            <span style="font-size:1.2rem" title="Rocket">🟣</span>
            <span style="font-size:1.2rem" title="Card">💳</span>
            <span style="font-size:1.2rem" title="Cash on Delivery">💵</span>
          </div>
        </div>
      </div>
    </div>`;
  },

              <div style="display:flex;align-items:center;gap:8px">

                <div><div style="font-weight:600">${item.name}</div><div style="font-size:.75rem;color:var(--text-secondary)">× ${item.quantity}</div></div>
              </div>
              <span style="font-weight:700">${this.formatPrice(item.price*item.quantity)}</span>

              ✅ Place Order — ${this.formatPrice(total)}

  // ✅ PLACE ORDER — database এ save হবে
  async placeOrder() {
    // Validation
    const fname = document.getElementById('co-fname')?.value?.trim();
    const phone = document.getElementById('co-phone')?.value?.trim();
    const street = document.getElementById('co-street')?.value?.trim();
    const thana = document.getElementById('co-thana')?.value?.trim();

    if (!fname) { this.toast('নাম দাও!', 'error'); document.getElementById('co-fname')?.focus(); return; }
    if (!phone || phone.length < 11) { this.toast('সঠিক phone number দাও!', 'error'); document.getElementById('co-phone')?.focus(); return; }
    if (!street) { this.toast('ঠিকানা দাও!', 'error'); document.getElementById('co-street')?.focus(); return; }

    const btn = document.getElementById('place-order-btn');
    if (btn) { btn.innerHTML = '⏳ Placing Order...'; btn.disabled = true; }

    const subtotal = this.getCartTotal();
    const shipping = subtotal > 45 ? 0 : 3.63;
    const tax = subtotal * 0.05;
    const total = subtotal + shipping + tax;

    // Selected payment method
    const selectedPayment = document.querySelector('.payment-option.selected input[type="radio"]');
    const paymentMethod = selectedPayment?.value || 'Cash on Delivery';

    const orderData = {
      customer: {
        firstName: fname,
        lastName: document.getElementById('co-lname')?.value || '',
        phone: phone,
        altPhone: document.getElementById('co-altphone')?.value || '',
      },
      address: {
        street: street,
        thana: thana || '',
        district: document.getElementById('co-district')?.value || '',
        division: document.getElementById('co-division')?.value || '',
        note: document.getElementById('co-note')?.value || '',
      },
      items: this.state.cart.map(item => ({
        productId: String(item.id),
        name: item.name,
        icon: item.icon || '📦',
        image: item.image || '',
        category: item.category,
        price: item.price,
        quantity: item.quantity,
      })),
      paymentMethod: paymentMethod,
      subtotal: subtotal,
      shipping: shipping,
      tax: tax,
      discount: 0,
      total: total,
      couponCode: this.state.couponApplied || '',
      currency: this.state.currency,
    };

    try {
      const res = await fetch(`${API}/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData),
      });
      const data = await res.json();
      if (data.success) {
        // Order saved!
        this.state.lastOrder = { ...orderData, _id: data.order._id, orderId: data.order._id };
        this.state.cart = [];
        this.state.couponApplied = null;
        localStorage.removeItem('foresstree-cart');
        this.navigate('order-success');
      } else {
        this.toast('Order failed: ' + (data.error || 'Unknown error'), 'error');
        if (btn) { btn.innerHTML = '✅ Place Order'; btn.disabled = false; }
      }
    } catch (err) {
      // Server বন্ধ থাকলেও order success দেখাও
      this.state.lastOrder = orderData;
      this.state.cart = [];
      this.state.couponApplied = null;
      localStorage.removeItem('foresstree-cart');
      this.navigate('order-success');
    }
  },
